[project]
name = "monkeybench"
version = "0.1.0"
description = "Brunner benchmark for monkey white blood cell localization and typing"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "brunner",
]

[dependency-groups]
dev = [
    "pillow>=11.0",
    "pytest>=8.3",
    "pytest-cov>=6",
    "yt-dlp>=2026.7.4",
]

[tool.uv.sources]
brunner = { path = "../brunner", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monkeybench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["monkeybench"]

[tool.coverage.report]
show_missing = true
skip_covered = true
